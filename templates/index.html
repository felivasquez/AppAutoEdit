<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Editor Automático</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .contenedor {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 400px;
            text-align: center;
        }

        input {
            margin: 20px 0;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #222;
            color: white;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <h1>Editor Automático</h1>

        <p>
            Subí una foto y mejorala automáticamente.
        </p>

        <form
            action="/editar"
            method="POST"
            enctype="multipart/form-data"
        >

            <input
                type="file"
                name="fotos"
                accept="image/*"
                multiple
                required
            >

            <br><br>

            <button type="submit">
                Mejorar fotos
            </button>

        </form>

    </div>

</body>

</html>
